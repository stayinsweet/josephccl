<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="抽抽乐统计">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23FF8C42' width='100' height='100' rx='20'/><text x='50' y='65' text-anchor='middle' fill='white' font-size='50' font-family='sans-serif'>🎴</text></svg>">
<title>抽抽乐统计</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@6/dist/tesseract.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <!-- Header -->
  <header class="header">
    <h1>🎴 抽抽乐统计</h1>
    <div style="display:flex;gap:4px;">
      <button class="btn btn-sm btn-white" onclick="exportData()">💾</button>
      <button class="btn btn-sm btn-white" onclick="importData()">📥</button>
      <button class="btn btn-sm btn-white" onclick="clearAllData()">🗑</button>
    </div>
  </header>

  <!-- Pool Selector -->
  <div class="pool-selector">
    <button class="pool-btn active" data-pool="xiari" onclick="switchPool('xiari')">🏖️ 夏日池</button>
    <button class="pool-btn" data-pool="junuan" onclick="switchPool('junuan')">🍊 橘暖池</button>
  </div>

  <!-- Main Content -->
  <main class="content" id="mainContent">

    <!-- Tab 1: 我的收藏 -->
    <div class="tab-page active" id="tab-collection">
      <div class="stats-row">
        <div class="stat-card"><div class="num orange" id="statTotal">0</div><div class="lbl">总抽数</div></div>
        <div class="stat-card"><div class="num pr-num" id="statPR">0</div><div class="lbl">拍立得</div></div>
        <div class="stat-card"><div class="num r-num" id="statR">0</div><div class="lbl">音乐卡</div></div>
        <div class="stat-card"><div class="num sr-num" id="statSR">0</div><div class="lbl">米兰卡</div></div>
        <div class="stat-card"><div class="num ssr-num" id="statSSR">0</div><div class="lbl">双面卡</div></div>
      </div>

      <div class="bonus-section">
        <div class="bonus-header">
          <h3>🎁 满赠进度</h3>
          <span class="bonus-total" id="bonusTotal">0 抽</span>
        </div>
        <div id="bonusMilestones"></div>
        <div style="margin-top:10px;">
          <button class="btn btn-sm btn-outline" onclick="editMilestones()">⚙️ 设置满赠档位</button>
        </div>
      </div>

      <div id="collectionGrid"></div>
    </div>

    <!-- Tab 2: 截图识别 -->
    <div class="tab-page" id="tab-ocr">
      <div style="text-align:center;font-size:13px;color:var(--brown-200);margin-bottom:12px;">📸 可一次选多张截图，依次识别后结果累加</div>
      <input type="file" id="screenshotInput" accept="image/*" multiple onchange="handleScreenshots(event)">
      <div class="upload-zone" onclick="document.getElementById('screenshotInput').click()" id="uploadZone">
        <div class="icon">📷</div><div class="text">点击上传截图（支持多选）</div><div class="hint">拍照或从相册批量选择 · 结果自动累加</div>
      </div>
      <div class="upload-preview" id="uploadPreview">
        <img id="previewImg" src="" alt="预览">
        <div class="ocr-result">
          <div class="ocr-title" id="ocrStatus">🤖 识别到的卡号（点击可剔除误识别）：</div>
          <div class="ocr-loading" id="ocrLoading">
            <div style="font-size:28px;animation:pulse 1s infinite;">🔍</div>
            <div style="font-size:13px;color:var(--brown-200);margin-top:6px;">正在识别截图中的卡号...</div>
          </div>
          <div style="display:flex;gap:6px;margin-bottom:8px;align-items:center;">
            <button class="btn btn-sm btn-outline" onclick="selectAllOCR()">✅ 全选</button>
            <button class="btn btn-sm btn-outline" onclick="deselectAllOCR()">✕ 清空</button>
            <span id="ocrExpectedHint" style="font-size:11px;color:var(--brown-200);margin-left:auto;"></span>
          </div>
          <div class="ocr-nums" id="ocrNumbers"></div>
        </div>
        <div class="btn-row">
          <button class="btn btn-outline" onclick="clearOCR()">✕ 取消</button>
          <button class="btn btn-primary" onclick="confirmOCR()">✅ 确认添加 (<span id="ocrCount">0</span>张)</button>
        </div>
      </div>
      <div style="margin-top:14px;padding:14px;background:var(--orange-50);border-radius:12px;font-size:12px;color:var(--brown-200);line-height:1.8;">
        <div style="font-weight:600;color:var(--brown-800);margin-bottom:4px;">💡 截图技巧</div>
        • 可一次选择多张截图，依次识别后结果累加<br>• 卡号格式：PR1、R3、SR2 等<br>• 识别结果每张卡有 ± 按钮调整数量<br>• 右侧提示「与奖品位一致」即可放心确认
      </div>
    </div>

    <!-- Tab 3: 手动输入 -->
    <div class="tab-page" id="tab-input">
      <div class="input-display">
        <div class="input-current" id="inputDisplay">
          <span style="color:var(--brown-200);font-size:18px;">选择卡牌类别</span>
        </div>
      </div>

      <div class="input-mode-toggle">
        <button class="input-mode-btn active" onclick="setInputMode('single')" id="modeSingle">🂡 单抽</button>
        <button class="input-mode-btn" onclick="setInputMode('batch')" id="modeBatch">🔟 十连</button>
      </div>
      <div class="batch-info" id="batchInfo">本轮已录 <span class="cnt" id="batchCnt">0</span> / 10 张</div>

      <div class="category-select" style="flex-wrap:wrap;">
        <button class="cat-btn pr-btn active" data-cat="pr" onclick="selectCategory('pr')">
          <span class="cat-icon">📸</span><span class="cat-label">拍立得 PR</span>
        </button>
        <button class="cat-btn r-btn" data-cat="r" onclick="selectCategory('r')">
          <span class="cat-icon">🎵</span><span class="cat-label">音乐卡 R</span>
        </button>
        <button class="cat-btn sr-btn" data-cat="sr" onclick="selectCategory('sr')">
          <span class="cat-icon">👗</span><span class="cat-label">米兰卡 SR</span>
        </button>
        <button class="cat-btn ssr-btn" data-cat="ssr" onclick="selectCategory('ssr')">
          <span class="cat-icon">💎</span><span class="cat-label">双面卡 SSR</span>
        </button>
      </div>

      <div class="numpad" id="numpadContainer"></div>
      <button class="btn btn-outline" style="width:100%;margin-top:4px;" onclick="undoLast()">↩ 撤销上一次</button>
    </div>

    <!-- Tab 4: 记录 -->
    <div class="tab-page" id="tab-history">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <span style="font-weight:700;font-size:16px;">📝 抽卡记录</span>
        <button class="btn btn-sm btn-outline" onclick="clearHistory()">🗑 清空</button>
      </div>
      <div id="historyList">
        <div style="text-align:center;padding:40px;color:var(--brown-200);">🃏 还没有抽卡记录</div>
      </div>
    </div>
  </main>

  <!-- Bottom Tab Bar -->
  <nav class="tab-bar">
    <button class="tab-item active" data-tab="collection" onclick="switchTab('collection')">
      <span class="tab-icon">📊</span>我的收藏
    </button>
    <button class="tab-item" data-tab="ocr" onclick="switchTab('ocr')">
      <span class="tab-icon">📷</span>截图识别
    </button>
    <button class="tab-item" data-tab="input" onclick="switchTab('input')">
      <span class="tab-icon">🔢</span>手动输入
    </button>
    <button class="tab-item" data-tab="history" onclick="switchTab('history')">
      <span class="tab-icon">📝</span>记录
    </button>
  </nav>
</div>

<!-- Card Detail Modal -->
<div class="modal-overlay" id="cardModal" style="display:none;" onclick="if(event.target===this)closeModal()">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-card-preview">
      <div class="modal-face front" id="modalFront"><span id="modalFrontPH">🃏</span><img id="modalFrontImg" src="" style="display:none;"></div>
      <div class="modal-face back" id="modalBack"><span id="modalBackPH">🎴</span><img id="modalBackImg" src="" style="display:none;"></div>
    </div>
    <div class="modal-info">
      <div class="modal-cid" id="modalCid">pr1</div>
      <div class="modal-name" id="modalName">卡名</div>
      <div class="modal-rarity" id="modalRarity">PR</div>
    </div>
    <div class="modal-counter">
      <button onclick="adjustCard(-1)">−</button>
      <span class="cnt" id="modalCount">0</span>
      <button onclick="adjustCard(1)">+</button>
    </div>
    <button class="btn btn-primary" style="width:100%;margin-bottom:8px;" onclick="adjustCard(1)">➕ 加一抽</button>
    <button class="btn btn-outline" style="width:100%;" onclick="closeModal()">关闭</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
